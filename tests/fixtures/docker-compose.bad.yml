version: "3.8"
services:
  db:
    image: postgres:15
    privileged: true
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: homelab
      POSTGRES_PASSWORD: changeme
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  web:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - /:/host
