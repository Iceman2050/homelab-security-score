http {
    server_tokens on;

    server {
        listen 80;
        server_name example.com;

        location / {
            proxy_pass http://app:3000;
        }
    }

    server {
        listen 443 ssl;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        server_name secure.example.com;
    }
}
