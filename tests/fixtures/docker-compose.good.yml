services:
  db:
    image: postgres:15
    user: "999:999"
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
  web:
    image: nginx:1.25
    user: "101:101"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
volumes:
  db-data:
